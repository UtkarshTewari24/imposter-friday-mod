plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Simple Voice Chat API (soft dependency — compile-only, see IMPLEMENTATION_NOTES.md)
	maven {
		name = 'Henkelmax'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"impostorfridays" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simple Voice Chat: compile against the API only. It is a SOFT dependency —
	// the mod must load and run fine when SVC is absent, so this is never bundled.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Boots the Fabric loader inside JUnit so tests can touch Minecraft registries
	// (Items, Bootstrap). Without it, registry init fails with IllegalAccessError.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	def props = [
		version           : project.mod_version,
		minecraft_version : project.minecraft_version,
		loader_version    : project.loader_version,
		loader_min_version: project.loader_min_version,
	]
	inputs.properties(props)
	filesMatching("fabric.mod.json") {
		expand(props)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
