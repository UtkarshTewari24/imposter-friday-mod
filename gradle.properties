# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties — verified against https://meta.fabricmc.net on 2026-09-06
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
# Built and tested against this loader.
loader_version=0.19.5
# Minimum loader the mod actually REQUIRES at runtime. Kept in step with what Fabric API
# itself asks for (0.17.3), rather than pinning to whatever we happened to build with —
# a tighter floor would lock out players whose launcher ships an older loader, which the
# Lunar Client Fabric add-on frequently does.
loader_min_version=0.17.3
loom_version=1.17.20

# Mod Properties
mod_version=1.0.0
maven_group=com.impostorfridays
archives_base_name=impostor-fridays

# Dependencies
fabric_api_version=0.141.6+1.21.11
# Simple Voice Chat API (compile-only, soft dependency)
voicechat_api_version=2.6.20
